<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>New Sheeba Jewellery – Gold Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  /* Golden Canvas Spectrum */
  --bg-gold-base: #f9f2dc;
  --bg-gold-deep: #ebd8a0;
  --gold-sheen: linear-gradient(135deg, #f7eed3 0%, #ecd79c 50%, #fdf5df 100%);
  --gold-accent: #cfa12b;
  --gold-border: rgba(184, 134, 11, 0.28);
  --gold-border-subtle: rgba(184, 134, 11, 0.16);

  /* Deep Maroon Typography & Accents */
  --maroon-dark: #380318;
  --maroon-primary: #520524;
  --maroon-light: #731238;
  --maroon-muted: #7d4458;
  --maroon-gradient: linear-gradient(135deg, #42041d 0%, #63092f 50%, #300214 100%);

  /* Surface Cards */
  --card-gold: #fffcf5;
  --card-gold-tint: rgba(255, 252, 245, 0.9);
  
  --green-emerald: #0b8036;
  --green-pill-bg: #eaf6ec;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--maroon-primary);
  background: radial-gradient(circle at 50% 0%, #fef8e7 0%, #ebd498 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

.phone {
  width: 100%;
  max-width: 450px;
  min-height: 100vh;
  background: var(--gold-sheen);
  box-shadow: 0 25px 60px rgba(56, 3, 24, 0.25);
  position: relative;
  overflow-x: hidden;
  padding-bottom: 35px;
}

/* Header with Gold Shimmer */
.topbar {
  background: var(--gold-sheen);
  padding: 22px 18px 18px;
  position: sticky;
  top: 0;
  z-index: 50;
  border-bottom: 1.5px solid var(--gold-border);
  box-shadow: 0 6px 20px rgba(94, 12, 44, 0.06);
  overflow: hidden;
}

.sparkle-canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}

.sparkle {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff 10%, #d4af37 60%, transparent 80%);
  opacity: 0;
  animation: sparkleTwinkle ease-in-out infinite;
}

@keyframes sparkleTwinkle {
  0% { opacity: 0; transform: translateY(8px) scale(0.2); }
  50% { opacity: 1; transform: translateY(-4px) scale(1); filter: drop-shadow(0 0 4px #cfa12b); }
  100% { opacity: 0; transform: translateY(-16px) scale(0.2); }
}

.toprow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 2;
}

.brand {
  text-align: center;
}

.brand .name {
  font-family: 'Cinzel', serif;
  background: var(--maroon-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.brand .sub {
  font-size: 10.5px;
  color: var(--maroon-muted);
  letter-spacing: 2.5px;
  margin-top: 3px;
  text-transform: uppercase;
  font-weight: 700;
}

.icon-btn {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.6);
  border: 1.5px solid var(--gold-border);
  color: var(--maroon-primary);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 2px 8px rgba(94, 12, 44, 0.05);
}

.icon-btn:hover {
  background: #ffffff;
  transform: scale(1.1) rotate(6deg);
  border-color: var(--maroon-primary);
}

.content {
  padding: 20px 16px;
}

/* Search Card */
.search-card {
  background: var(--card-gold);
  padding: 16px 18px;
  border-radius: 20px;
  border: 1px solid var(--gold-border);
  box-shadow: 0 8px 24px rgba(78, 14, 38, 0.05);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.search-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; height: 3.5px;
  background: var(--maroon-gradient);
}

.input-label {
  font-size: 12px;
  font-weight: 800;
  color: var(--maroon-dark);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.searchrow {
  display: flex;
  gap: 10px;
}

.searchrow input {
  flex: 1;
  border: 1.5px solid var(--gold-border);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--maroon-dark);
  background: #ffffff;
  outline: none;
  transition: all 0.25s ease;
}

.searchrow input:focus {
  border-color: var(--maroon-primary);
  box-shadow: 0 0 0 4px rgba(82, 5, 36, 0.12);
  transform: translateY(-1px);
}

.search-btn {
  width: 56px;
  border: none;
  border-radius: 14px;
  background: var(--maroon-gradient);
  color: #f7e6a6;
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(66, 4, 29, 0.35);
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

.search-btn:hover {
  transform: scale(1.06) translateY(-2px);
  box-shadow: 0 10px 24px rgba(66, 4, 29, 0.45);
}

.search-btn:active {
  transform: scale(0.95);
}

/* Staggered Animated Cards */
.card {
  background: var(--card-gold);
  border: 1px solid var(--gold-border);
  border-radius: 20px;
  padding: 20px 18px;
  box-shadow: 0 8px 24px rgba(78, 14, 38, 0.05);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(24px) scale(0.97);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.card.animate-in {
  animation: springCardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes springCardIn {
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(78, 14, 38, 0.08);
}

.card-title {
  font-family: 'Cinzel', serif;
  color: var(--maroon-dark);
  font-size: 14.5px;
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(184, 134, 11, 0.15);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Details Section */
.detail-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.detail-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  padding: 2px 0;
}

.detail-label {
  color: var(--maroon-muted);
  font-weight: 600;
}

.detail-val {
  color: var(--maroon-dark);
  font-weight: 800;
  text-align: right;
  max-width: 60%;
}

.detail-val.phone-link {
  color: var(--green-emerald);
  font-weight: 800;
  letter-spacing: 0.5px;
}

/* Quick Metrics Row */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.stat-box {
  background: var(--card-gold);
  border: 1px solid var(--gold-border);
  border-radius: 16px;
  padding: 16px 8px;
  text-align: center;
  box-shadow: 0 6px 18px rgba(78, 14, 38, 0.04);
  opacity: 0;
  transform: translateY(20px);
  transition: transform 0.25s ease;
}

.stat-box.animate-in {
  animation: springCardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.stat-box:nth-child(1) { animation-delay: 0.1s; }
.stat-box:nth-child(2) { animation-delay: 0.2s; }
.stat-box:nth-child(3) { animation-delay: 0.3s; }

.stat-box.primary {
  background: #ffffff;
  border: 1.5px solid var(--maroon-primary);
  position: relative;
  overflow: hidden;
}

.stat-box.primary::after {
  content: "";
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: linear-gradient(45deg, transparent 45%, rgba(207, 161, 43, 0.25) 50%, transparent 55%);
  transform: rotate(30deg);
  animation: sheenEffect 4s ease-in-out infinite;
}

@keyframes sheenEffect {
  0%, 70% { transform: translateX(-100%) rotate(30deg); }
  100% { transform: translateX(100%) rotate(30deg); }
}

.stat-lbl {
  font-size: 10.5px;
  color: var(--maroon-muted);
  font-weight: 700;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat-num {
  font-size: 17px;
  font-weight: 800;
  color: var(--maroon-dark);
}

.stat-box.primary .stat-num {
  color: var(--maroon-primary);
  font-size: 18px;
}

/* Statement Table */
.table-container {
  overflow-x: auto;
  border-radius: 14px;
  border: 1px solid var(--gold-border);
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #ffffff;
  font-size: 13.5px;
}

th {
  background: #fbf3dc;
  color: var(--maroon-dark);
  font-weight: 800;
  padding: 12px 10px;
  text-align: left;
  font-size: 11.5px;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--gold-border);
}

td {
  padding: 12px 10px;
  border-bottom: 1px solid rgba(184, 134, 11, 0.12);
  color: var(--maroon-primary);
  font-weight: 600;
  transition: background 0.2s ease;
}

tr:hover td {
  background: #fdf8eb;
}

tr.table-row-animated {
  opacity: 0;
  transform: translateX(-10px);
  animation: rowSlideIn 0.4s ease forwards;
}

@keyframes rowSlideIn {
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

tr.latest-row td {
  color: var(--green-emerald);
  font-weight: 800;
  background: var(--green-pill-bg);
}

/* WhatsApp Interactive Action Buttons */
.actions-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 18px 0 14px;
}

.btn-action {
  border: none;
  border-radius: 16px;
  padding: 16px 14px;
  color: white;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 96px;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 6px 18px rgba(56, 3, 24, 0.15);
  position: relative;
  overflow: hidden;
}

.btn-action.receipt {
  background: linear-gradient(135deg, #098841 0%, #045a29 100%);
}

.btn-action.statement {
  background: var(--maroon-gradient);
  border: 1.5px solid rgba(235, 212, 152, 0.5);
}

.btn-action:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 12px 26px rgba(56, 3, 24, 0.25);
}

.btn-action:active {
  transform: translateY(0) scale(0.96);
}

.btn-title {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-action.statement .btn-title {
  color: #faecc0;
}

.btn-sub {
  font-size: 11px;
  opacity: 0.9;
  font-weight: 500;
  line-height: 1.3;
}

/* Status Notifications */
.status-banner {
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 13.5px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: popIn 0.3s ease;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.status-loading {
  background: #ffffff;
  color: var(--maroon-primary);
  border: 1px solid var(--gold-border);
}

.status-loading::after {
  content: "";
  width: 16px; height: 16px;
  border: 2px solid var(--maroon-primary);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.status-error {
  background: #fef2f2;
  color: #ba1a1a;
  border: 1px solid #fecaca;
  animation: shake 0.35s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.hidden { display: none !important; }

/* Dynamic Ripple */
.ripple {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  background: rgba(255, 255, 255, 0.4);
  pointer-events: none;
  animation: rippleAnim 0.55s ease-out forwards;
}

@keyframes rippleAnim {
  to { transform: scale(3.5); opacity: 0; }
}
</style>
</head>
<body>

<div class="phone">
  <header class="topbar">
    <div class="sparkle-canvas" id="sparkles"></div>
    <div class="toprow">
      <div class="icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </div>
      <div class="brand">
        <div class="name">New Sheeba</div>
        <div class="sub">Owner Portal</div>
      </div>
      <div class="icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="search-card">
      <label class="input-label" for="accountInput">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        Search Customer Passbook
      </label>
      <div class="searchrow">
        <input id="accountInput" inputmode="numeric" placeholder="e.g. 3575" autocomplete="off">
        <button id="searchBtn" class="search-btn" title="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </div>
    </div>

    <div id="status" class="status-banner hidden"></div>

    <section id="result" class="hidden">
      <!-- Profile Card -->
      <div class="card" id="cardProfile">
        <div class="card-title">Customer Profile</div>
        <div class="detail-grid">
          <div class="detail-item">
            <span class="detail-label">Passbook No.</span>
            <span class="detail-val" id="accountNo" style="font-size:16px;">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Full Name</span>
            <span class="detail-val" id="customerName">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">City / Address</span>
            <span class="detail-val" id="address">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">WhatsApp Contact</span>
            <span class="detail-val phone-link" id="phone">-</span>
          </div>
        </div>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="stats-grid">
        <div class="stat-box primary" id="statBox1">
          <div class="stat-lbl">Total Paid</div>
          <div class="stat-num" id="totalPaid">₹0</div>
        </div>
        <div class="stat-box" id="statBox2">
          <div class="stat-lbl">Installments</div>
          <div class="stat-num" id="installments">0</div>
        </div>
        <div class="stat-box" id="statBox3">
          <div class="stat-lbl">Last Payment</div>
          <div class="stat-num" style="font-size:12px; margin-top:3px;" id="lastPayment">-</div>
        </div>
      </div>

      <!-- Passbook Statement -->
      <div class="card" id="cardStatement">
        <div class="card-title">Passbook Statement</div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Paid (₹)</th>
                <th>Total (₹)</th>
                <th>#</th>
              </tr>
            </thead>
            <tbody id="paymentsBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="actions-grid">
        <button class="btn-action receipt" id="receiptBtn">
          <span class="btn-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16l4-2 4 2 4-2 4 2V8z"></path></svg>
            Send Receipt
          </span>
          <span class="btn-sub">Share last receipt on WhatsApp</span>
        </button>

        <button class="btn-action statement" id="statementBtn">
          <span class="btn-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="12" y2="14"></line></svg>
            Statement
          </span>
          <span class="btn-sub">Send full statement on WhatsApp</span>
        </button>
      </div>
    </section>

    <div id="welcome" style="text-align:center; padding:50px 20px; color:var(--maroon-muted);">
      <div style="font-weight:700; font-size:14px; margin-bottom:4px; color:var(--maroon-dark);">Enter Passbook Number</div>
      <div style="font-size:12px;">Search to load account records and ledger.</div>
    </div>
  </main>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzd7pJncxJAObQm1r1M2Ws03EdKSb1xtlq64KNeiF_MpiL5OvPCS8iT3lb8H1_K-dB3Gg/exec";
let currentCustomer = null;

// Dynamic Sparkle Generator
(function initSparkles() {
  const container = document.getElementById("sparkles");
  if (!container) return;
  const count = 18;
  for (let i = 0; i < count; i++) {
    const s = document.createElement("span");
    s.className = "sparkle";
    const size = (Math.random() * 3.5 + 1.5).toFixed(1);
    s.style.width = s.style.height = size + "px";
    s.style.left = (Math.random() * 100).toFixed(1) + "%";
    s.style.top = (Math.random() * 100).toFixed(1) + "%";
    s.style.animationDuration = (Math.random() * 2.5 + 2.2).toFixed(2) + "s";
    s.style.animationDelay = (Math.random() * 3).toFixed(2) + "s";
    container.appendChild(s);
  }
})();

// Animated Number Counter
function animateCount(el, target, isCurrency = false) {
  let start = 0;
  const duration = 900;
  const startTime = performance.now();
  
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const easeOut = 1 - Math.pow(1 - progress, 3);
    const currentVal = Math.floor(start + (target - start) * easeOut);
    
    el.textContent = isCurrency 
      ? "₹" + currentVal.toLocaleString("en-IN")
      : currentVal;
      
    if (progress < 1) {
      requestAnimationFrame(update);
    } else {
      el.textContent = isCurrency 
        ? "₹" + target.toLocaleString("en-IN")
        : target;
    }
  }
  requestAnimationFrame(update);
}

function cleanPhone(p) {
  return String(p || "").replace(/\D/g, "");
}

function showStatus(msg, type = "loading") {
  const el = document.getElementById("status");
  el.className = `status-banner status-${type}`;
  el.textContent = msg;
  el.classList.remove("hidden");
}

function hideStatus() {
  document.getElementById("status").classList.add("hidden");
}

function escapeHtml(v) {
  return String(v ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
}

function renderCustomer(c) {
  currentCustomer = c;
  document.getElementById("welcome").classList.add("hidden");
  const resultSec = document.getElementById("result");
  resultSec.classList.remove("hidden");
  
  document.getElementById("accountNo").textContent = c.accountNo || "-";
  document.getElementById("customerName").textContent = c.name || "-";
  document.getElementById("address").textContent = c.address || "-";
  document.getElementById("phone").textContent = c.phone || "Not recorded";
  document.getElementById("lastPayment").textContent = c.lastPaymentDate || "-";

  // Trigger Counting Animations
  animateCount(document.getElementById("totalPaid"), Number(c.totalPaid || 0), true);
  animateCount(document.getElementById("installments"), (c.payments || []).length, false);

  // Render Table with Staggered Slide In
  const body = document.getElementById("paymentsBody");
  body.innerHTML = "";
  const payments = c.payments || [];
  payments.forEach((p, i) => {
    const tr = document.createElement("tr");
    tr.className = "table-row-animated" + (i === payments.length - 1 ? " latest-row" : "");
    tr.style.animationDelay = `${(i * 0.04) + 0.15}s`;
    tr.innerHTML = `
      <td>${escapeHtml(p.date)}</td>
      <td>${Number(p.amount || 0).toLocaleString("en-IN")}</td>
      <td>${Number(p.total || 0).toLocaleString("en-IN")}</td>
      <td>${i + 1}</td>
    `;
    body.appendChild(tr);
  });

  // Trigger Stagger Entrance for Cards
  const cards = [
    document.getElementById("cardProfile"),
    document.getElementById("statBox1"),
    document.getElementById("statBox2"),
    document.getElementById("statBox3"),
    document.getElementById("cardStatement")
  ];
  
  cards.forEach(node => {
    node.classList.remove("animate-in");
    void node.offsetWidth;
    node.classList.add("animate-in");
  });
}

async function searchCustomer() {
  const account = document.getElementById("accountInput").value.trim();
  if (!account) {
    showStatus("Please enter customer number", "error");
    return;
  }
  
  showStatus("Retrieving customer passbook...", "loading");
  document.getElementById("result").classList.add("hidden");

  try {
    const res = await fetch(API_URL + "?action=getCustomer&account=" + encodeURIComponent(account), { method: "GET" });
    const data = await res.json();
    hideStatus();
    if (!data.ok) {
      showStatus(data.message || "Customer not found.", "error");
      return;
    }
    renderCustomer(data.customer);
  } catch (err) {
    showStatus("Connection to database failed.", "error");
  }
}

function openWhatsApp(kind) {
  if (!currentCustomer) return;
  const phone = cleanPhone(currentCustomer.phone);
  if (!phone) {
    showStatus("No phone number registered for customer.", "error");
    return;
  }
  
  let text = "";
  if (kind === "receipt") {
    const last = currentCustomer.payments?.[currentCustomer.payments.length - 1];
    text = 
`✨ *NEW SHEEBA JEWELLERY* ✨
_Official Payment Receipt_

*Passbook No:* ${currentCustomer.accountNo}
*Customer Name:* ${currentCustomer.name}
*Payment Date:* ${last?.date || currentCustomer.lastPaymentDate || "-"}
*Amount Received:* ₹${Number(last?.amount || 0).toLocaleString("en-IN")}
*Cumulative Total:* ₹${Number(currentCustomer.totalPaid || 0).toLocaleString("en-IN")}
*Installments Completed:* ${(currentCustomer.payments || []).length}

Thank you for your valuable relationship with New Sheeba Jewellery.`;
  } else {
    text = 
`✨ *NEW SHEEBA JEWELLERY* ✨
_Customer Account Statement_

*Passbook No:* ${currentCustomer.accountNo}
*Customer Name:* ${currentCustomer.name}
*Address:* ${currentCustomer.address || "-"}
*Total Amount Paid:* ₹${Number(currentCustomer.totalPaid || 0).toLocaleString("en-IN")}
*Total Installments:* ${(currentCustomer.payments || []).length}
*Last Payment:* ${currentCustomer.lastPaymentDate || "-"}

*Passbook Ledger:*
` + (currentCustomer.payments || []).map((p, i) => `${i + 1}. ${p.date} — ₹${Number(p.amount || 0).toLocaleString("en-IN")}`).join("\n");
  }
  window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(text), "_blank");
}

// Button Ripples
document.querySelectorAll(".search-btn, .btn-action, .icon-btn").forEach(b => {
  b.addEventListener("click", e => {
    const rect = b.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const span = document.createElement("span");
    span.className = "ripple";
    span.style.width = span.style.height = size + "px";
    span.style.left = (e.clientX - rect.left - size / 2) + "px";
    span.style.top = (e.clientY - rect.top - size / 2) + "px";
    b.appendChild(span);
    span.addEventListener("animationend", () => span.remove());
  });
});

document.getElementById("searchBtn").addEventListener("click", searchCustomer);
document.getElementById("accountInput").addEventListener("keydown", e => { if (e.key === "Enter") searchCustomer(); });
document.getElementById("receiptBtn").addEventListener("click", () => openWhatsApp("receipt"));
document.getElementById("statementBtn").addEventListener("click", () => openWhatsApp("statement"));
</script>
